services:
  node1:
    build: ./node
    environment:
      ROLE: leader
      FOLLOWER_URLS: http://node2:8080,http://node3:8080,http://node4:8080,http://node5:8080
      WRITE_QUORUM_SIZE: 3
      READ_QUORUM_SIZE: 3
    ports:
      - "8080:8080"

  node2:
    build: ./node
    environment:
      ROLE: follower
      FOLLOWER_URLS: http://node1:8080,http://node3:8080,http://node4:8080,http://node5:8080
      READ_QUORUM_SIZE: 3
    ports:
      - "8081:8080"

  node3:
    build: ./node
    environment:
      ROLE: follower
      FOLLOWER_URLS: http://node1:8080,http://node2:8080,http://node4:8080,http://node5:8080
      READ_QUORUM_SIZE: 3
    ports:
      - "8082:8080"

  node4:
    build: ./node
    environment:
      ROLE: follower
      FOLLOWER_URLS: http://node1:8080,http://node2:8080,http://node3:8080,http://node5:8080
      READ_QUORUM_SIZE: 3
    ports:
      - "8083:8080"

  node5:
    build: ./node
    environment:
      ROLE: follower
      FOLLOWER_URLS: http://node1:8080,http://node2:8080,http://node3:8080,http://node4:8080
      READ_QUORUM_SIZE: 3
    ports:
      - "8084:8080"